[project]
name = "kaneo-templates"
version = "0.1.0"
description = "Create Kaneo projects with scheduled tasks from YAML templates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
kaneo-templates = "kaneo_templates.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requires a running Kaneo instance (deselected by default)",
]
