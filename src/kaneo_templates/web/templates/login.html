{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-sm space-y-4 pt-4 sm:pt-12">
  {% if notice %}{% call m.alert("info") %}{{ t(notice) }}{% endcall %}{% endif %}
  <div class="card space-y-5 p-6">
    <div class="space-y-1.5 text-center">
      <span class="mx-auto mb-3 flex size-10 items-center justify-center rounded-xl bg-primary text-primary-foreground">{{ m.icon("logo", "size-5") }}</span>
      <h1 class="text-lg">{{ t("sign_in_title") }}</h1>
      <p class="text-muted-foreground">{{ t("sign_in_intro") }}</p>
    </div>

    <form hx-post="login/device" hx-target="#device" hx-disabled-elt="find button" hx-indicator="this">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <button type="submit" class="btn btn-primary w-full">
        <span class="htmx-hide-on-request">{{ t("sign_in_device") }}</span>{{ m.spinner(t("sign_in_device")) }}
      </button>
    </form>
    <div id="device" class="empty:hidden" aria-live="polite"></div>

    <div class="flex items-center gap-3 text-xs text-muted-foreground uppercase">
      <span class="h-px flex-1 bg-border"></span>{{ t("or") }}<span class="h-px flex-1 bg-border"></span>
    </div>

    <form class="space-y-3" hx-post="login/token" hx-target="#token-error" hx-disabled-elt="find button" hx-indicator="this">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <div class="space-y-2">
        <label class="label" for="token">{{ m.icon("key", "size-3.5 text-muted-foreground") }}{{ t("token_label") }}</label>
        <input class="input font-mono" type="password" id="token" name="token" required autocomplete="off" spellcheck="false">
        <p class="hint">{{ t("token_hint") }}</p>
      </div>
      <div id="token-error" class="empty:hidden" aria-live="polite"></div>
      <button type="submit" class="btn btn-outline w-full">
        <span class="htmx-hide-on-request">{{ t("token_submit") }}</span>{{ m.spinner(t("token_submit")) }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
